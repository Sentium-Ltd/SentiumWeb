  <!-- Eyebrow -->
  <text x="90" y="200"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="22"
        font-weight="600"
        letter-spacing="3"
        fill="#f5c738">SENTIUM</text>

  <!-- Headline -->
  <text x="90" y="310"
        font-family="'Fraunces', 'Times New Roman', Georgia, serif"
        font-size="84"
        font-weight="600"
        fill="#f4f5f7"
        letter-spacing="-2">A studio for</text>
  <text x="90" y="400"
        font-family="'Fraunces', 'Times New Roman', Georgia, serif"
        font-size="84"
        font-weight="600"
        fill="url(#accent)"
        letter-spacing="-2">everyday software.</text>

  <!-- Tagline / catchphrase -->
  <text x="90" y="480"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="28"
        font-weight="500"
        fill="#9aa1ad"><tspan fill="#ef4d31" font-weight="600">You ask.</tspan> We plan. We build. We ship.</text>

  <!-- Domain -->
  <text x="90" y="560"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="20"
        font-weight="600"
        letter-spacing="1"
        fill="#f4f5f7">sentium.app</text>

